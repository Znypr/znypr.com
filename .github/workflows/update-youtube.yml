name: Update latest YouTube videos

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:

permissions:
  contents: write
  models: read

concurrency:
  group: update-youtube
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic defusedxml

      - name: Refresh assets/youtube-latest.json
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_youtube.py assets/youtube-latest.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/youtube-latest.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update latest YouTube videos"
            git pull --rebase origin main
            git push
          fi
