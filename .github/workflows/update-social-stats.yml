name: Update social metrics

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/update-stats-v2.mjs
      - .github/workflows/update-social-stats.yml

permissions:
  contents: write

concurrency:
  group: social-metrics
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch current verified public metrics
        run: node scripts/update-stats-v2.mjs
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}

      - name: Commit refreshed metrics
        run: |
          if git diff --quiet -- assets/stats.json; then
            echo "No metric changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.json
          git commit -m "chore: refresh verified social metrics"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Remote changed while metrics were refreshing; rebasing (attempt $attempt)..."
            git fetch origin main
            git rebase origin/main
          done

          echo "Could not publish refreshed metrics after retries"
          exit 1
